[project]
name = "topdon-tc002c-duo-macos"
version = "0.1.0"
description = "Live TOPDON TC002C Duo thermal viewer for macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "flask>=3.1.2",
    "libusb-package>=1.0.30.0",
    "numpy>=2.2.0",
    "opencv-python>=4.12.0.88",
    "pyusb>=1.3.1",
]

[project.scripts]
topdon-duo = "topdon_duo.web:main"
topdon-duo-desktop = "topdon_duo.desktop:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topdon_duo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
