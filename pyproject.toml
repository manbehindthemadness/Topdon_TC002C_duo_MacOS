[project]
name = "based-thermals"
version = "0.1.0"
description = "Extensible thermal-camera viewer and processing pipelines for macOS and Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "flask>=3.1.2",
    "libusb-package>=1.0.30.0",
    "numpy>=2.2.0",
    "onnxruntime>=1.23",
    "opencv-python>=4.12.0.88",
    "pyusb>=1.3.1",
    "pyside6-essentials>=6.8.0",
]

[project.urls]
Repository = "https://github.com/manbehindthemadness/based-thermals"

[project.scripts]
based-thermals = "based_thermals.web:main"
based-thermals-desktop = "based_thermals.desktop:main"
based-thermals-models = "based_thermals.onnx_models:main"

[project.optional-dependencies]
apple = ["onnxruntime>=1.23; sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/based_thermals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
